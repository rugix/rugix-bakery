name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ github.repository_owner == 'rugix' && 'recursive' || false }}

      - name: Configure Git URL Rewrites
        if: github.repository_owner != 'rugix'
        run: |
          OWNER="${{ github.repository_owner }}"
          git config --global url.https://github.com/rugix/rugix.git.insteadOf "https://github.com/${OWNER}/rugix"
          git config --global url.https://github.com/rugix/rugix-tests.git.insteadOf "https://github.com/${OWNER}/rugix-tests"

      - name: Checkout Submodules
        if: github.repository_owner != 'rugix'
        run: git submodule sync --recursive && git submodule update --init --recursive

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Cargo Deny
        run: mise run --skip-tools check:deny

      - name: Clippy
        # Clippy is currently generating an ICE.
        continue-on-error: true
        run: mise run --skip-tools check:clippy

      - name: Test
        run: mise run --skip-tools test:unit

      - name: Format
        run: mise run --skip-tools check:fmt

  check-tests:
    name: Check System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: true
      - name: Install Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install python uv
      - name: Check System Tests
        run: mise run --skip-tools check:tests
      - name: Test Build Tooling
        run: mise run --skip-tools test:tooling
