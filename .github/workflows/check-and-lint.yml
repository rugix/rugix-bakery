name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ github.repository_owner == 'rugix' && 'recursive' || false }}

      - name: Configure Git URL Rewrites
        if: github.repository_owner != 'rugix'
        run: |
          OWNER="${{ github.repository_owner }}"
          git config --global url.https://github.com/rugix/rugix.git.insteadOf "https://github.com/${OWNER}/rugix"

      - name: Checkout Submodules
        if: github.repository_owner != 'rugix'
        run: git submodule sync --recursive && git submodule update --init --recursive

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: stable

      - name: Install Nightly Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: nightly-2026-08-14
          components: clippy, rustfmt

      - name: Clippy
        # Clippy is currently generating an ICE.
        continue-on-error: true
        run: cargo +nightly-2026-08-14 clippy --all-targets --all-features

      - name: Test
        run: cargo +nightly-2026-08-14 test --all-features

      - name: Format
        run: cargo +nightly-2026-08-14 fmt --check

  check-tests:
    name: Check System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: true
      - name: Install Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install python uv
      - name: Check System Tests
        run: mise run --skip-tools check:tests
