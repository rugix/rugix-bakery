name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ github.repository_owner == 'rugix' && 'recursive' || false }}

      - name: Configure Git URL Rewrites
        if: github.repository_owner != 'rugix'
        run: |
          OWNER="${{ github.repository_owner }}"
          git config --global url.https://github.com/rugix/rugix.git.insteadOf "https://github.com/${OWNER}/rugix"
          git config --global url.https://github.com/rugix/rugix-tests.git.insteadOf "https://github.com/${OWNER}/rugix-tests"

      - name: Checkout Submodules
        if: github.repository_owner != 'rugix'
        run: git submodule sync --recursive && git submodule update --init --recursive

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable

      - name: Install Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Clippy
        # Clippy is currently generating an ICE.
        continue-on-error: true
        run: cargo +nightly clippy --all-targets --all-features

      - name: Test
        run: cargo +nightly test --all-features

      - name: Format
        run: cargo +nightly fmt --check
