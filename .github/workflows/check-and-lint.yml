name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable

      - name: Install Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Clippy
        # Clippy is currently generating an ICE.
        continue-on-error: true
        run: cargo +nightly clippy --all-targets --all-features

      - name: Test
        run: cargo +nightly test --all-features

      - name: Format
        # Preserve the release's formatting without pinning the build compiler.
        run: |
          rustup toolchain install nightly-2026-08-14 --profile minimal --component rustfmt
          cargo +nightly-2026-08-14 fmt --check
