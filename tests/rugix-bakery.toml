[repositories]
rugix-testkit = { git = "https://github.com/rugix/rugix-testkit.git", branch = "main", dir = "bakery" }

[systems.efi]
layer = "efi"
architecture = "amd64"
target = "generic-grub-efi"

[systems.efi-squashfs]
layer = "efi"
architecture = "amd64"
target = "generic-grub-efi"
options = { use-squashfs = {} }

[systems.debian-package-musl]
layer = "debian-package-musl"
architecture = "amd64"
target = "generic-grub-efi"

[systems.debian-package-gnu]
layer = "debian-package-gnu"
architecture = "amd64"
target = "generic-grub-efi"

[systems.tryboot]
layer = "pi-tryboot"
architecture = "arm64"
target = "rpi-tryboot"

[systems.tryboot-pi4]
layer = "pi4-tryboot"
architecture = "arm64"
target = "rpi-tryboot"

[systems.uboot-arm64]
layer = "pi-uboot"
architecture = "arm64"
target = "rpi-uboot"

[systems.uboot-armhf]
layer = "pi-uboot"
architecture = "armhf"
target = "rpi-uboot"

[systems.old-debian-snapshot]
layer = "old-debian-snapshot"
architecture = "amd64"
target = "generic-grub-efi"

[systems.efi-verified]
layer = "efi-verified"
architecture = "amd64"

[systems.efi-verified.rules.release]
uses = "core/image-debian-efi-verified"
parameters.architecture = "amd64"
parameters.cmdline-extra = "console=ttyS0,115200n8"
inputs.boot-certificate = { path = ".rugix-testkit/verified-keys/boot.crt" }
inputs.bundle-certificate = { path = ".rugix-testkit/verified-keys/bundle.crt" }
rules.efi-signer.secrets.key = { path = ".rugix-testkit/verified-keys/boot.key" }
rules.bundle-signer.secrets.key = { path = ".rugix-testkit/verified-keys/bundle.key" }

[systems.efi-verified.outputs]
"sbom.spdx.json" = { rule = { node = "sbom", output = "spdx" } }
root-hash = { rule = { node = "release", output = "root-hash" } }
"bootloader.efi" = { rule = { node = "release", output = "bootloader" } }
"system.img" = { rule = { node = "release", output = "image" } }
"system.rugixb" = { rule = { node = "release", output = "bundle" } }
"system.rugixb-hash" = { rule = { node = "release", output = "bundle-hash" } }

[systems.efi-verified.rules.sbom]
uses = "core/sbom"
inputs.tree = { input = "rootfs" }

[systems.efi-verified-enroll]
layer = "efi-verified"
architecture = "amd64"

[systems.efi-verified-enroll.rules.secure-boot-keys]
uses = "secure-boot-keys"
inputs.certificate = { path = ".rugix-testkit/verified-keys/boot.crt" }
secrets.key = { path = ".rugix-testkit/verified-keys/boot.key" }

[systems.efi-verified-enroll.rules.release]
uses = "core/image-debian-efi-verified"
parameters.architecture = "amd64"
parameters.cmdline-extra = "console=ttyS0,115200n8"
inputs.boot-certificate = { path = ".rugix-testkit/verified-keys/boot.crt" }
inputs.bundle-certificate = { path = ".rugix-testkit/verified-keys/bundle.crt" }
inputs.secure-boot-keys = { rule = { node = "secure-boot-keys", output = "keys" } }
rules.efi-signer.secrets.key = { path = ".rugix-testkit/verified-keys/boot.key" }
rules.bundle-signer.secrets.key = { path = ".rugix-testkit/verified-keys/bundle.key" }

[systems.efi-verified-enroll.outputs]
root-hash = { rule = { node = "release", output = "root-hash" } }
"system.img" = { rule = { node = "release", output = "image" } }

# The verified system signed through PKCS#11 with keys in a SoftHSM token: the
# same boot key and an ECDSA bundle signer issued by the same bundle root.
[systems.efi-verified-hsm]
layer = "efi-verified"
architecture = "amd64"

[systems.efi-verified-hsm.rules.token]
uses = "hsm-token"
secrets.boot-key = { path = ".rugix-testkit/verified-keys/boot.key" }
secrets.bundle-key = { path = ".rugix-testkit/verified-keys/bundle-hsm.key" }
secrets.pin = { path = ".rugix-testkit/verified-keys/hsm.pin" }

[systems.efi-verified-hsm.rules.release]
uses = "core/image-debian-efi-verified"
parameters.architecture = "amd64"
parameters.cmdline-extra = "console=ttyS0,115200n8"
inputs.boot-certificate = { path = ".rugix-testkit/verified-keys/boot.crt" }
inputs.bundle-certificate = { path = ".rugix-testkit/verified-keys/bundle-hsm.crt" }

[systems.efi-verified-hsm.rules.release.rules.efi-signer]
uses = "hsm-sign-efi"
inputs.token = { rule = { node = "token", output = "token" } }
parameters.key-label = "boot"
secrets.pin = { path = ".rugix-testkit/verified-keys/hsm.pin" }

[systems.efi-verified-hsm.rules.release.rules.bundle-signer]
uses = "hsm-sign-cms"
inputs.token = { rule = { node = "token", output = "token" } }
parameters.key-label = "bundle"
secrets.pin = { path = ".rugix-testkit/verified-keys/hsm.pin" }

[systems.efi-verified-hsm.outputs]
root-hash = { rule = { node = "release", output = "root-hash" } }
"bootloader.efi" = { rule = { node = "release", output = "bootloader" } }
"system.img" = { rule = { node = "release", output = "image" } }
"system.rugixb" = { rule = { node = "release", output = "bundle" } }
"system.rugixb-hash" = { rule = { node = "release", output = "bundle-hash" } }
