description = "Sign an EFI executable with a private key in a PKCS#11 token."
secrets = ["pin"]

[inputs.image]
kind = "file"
description = "PE executable to sign."

[inputs.certificate]
kind = "file"
description = "PEM-encoded certificate of the signing key."

[inputs.token]
kind = "directory"
description = "SoftHSM token directory."

[parameters.signing-time]
description = "Signing time as Unix seconds in a string. Empty uses the build source epoch."

[parameters.key-label]
description = "Label of the private key in the token."

[execution]
type = "run"
env = "hsm"
command = ["sh", "/run/rugix/bakery/work/rule/sign.sh"]

[execution.outputs.image]
description = "PE executable with a UEFI Secure Boot signature."
kind = "file"
path = "signed.efi"
