[tools]
"github:silitics/sidex" = { version = "0.4.1", exe = "sidex" }
# For the system tests.
python = "3.11"
uv = "latest"

# Native dependencies and cross compilers come from the pinned Nix shell.

[tasks.codegen]
description = "Regenerate the Sidex Rust bindings and JSON schemas."
run = "bash scripts/codegen.sh"

[tasks.build-binaries]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Build rugix-* binaries for aarch64 + x86_64 musl and stage them under build/binaries/"
run = "bash scripts/build-binaries.sh \"$@\""

[tasks.build-image]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Build the rugix-bakery container image (tag :dev) with Podman"
depends = ["build-binaries"]
run = "podman build -t ghcr.io/rugix/rugix-bakery:dev -f container/Dockerfile ."

[tasks.build]
description = "Build rugix-* binaries and the rugix-bakery :dev container image (Podman)"
depends = ["build-image"]

[tasks."test:system"]
shell = "nix develop \"{{config_root}}#system-tests\" --command bash -euo pipefail -c"
description = "Run the system tests against the :dev image (requires QEMU, OVMF, and mtools)"
dir = "tests"
run = 'uv run pytest "$@"'

[tasks."check:tests"]
description = "Lint, format-check, and type-check the system tests."
dir = "tests"
run = '''
uv run --group dev ruff check .
uv run --group dev ruff format --check .
uv run --group dev mypy .
'''

[tasks.doc]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Generate Rust documentation, including private items."
run = "cargo doc --workspace --document-private-items"

[tasks.check]
description = "Run formatting, dependency policy, Clippy, and unit tests."
depends = ["check:fmt", "check:deny", "check:clippy", "test:unit"]

[tasks.fmt]
description = "Format Rust code."
run = "cargo fmt"

[tasks."check:fmt"]
description = "Check Rust formatting."
run = "cargo fmt --check"

[tasks."check:deny"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Check dependency policy."
run = "cargo deny check"

[tasks."check:clippy"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run Clippy across the workspace."
run = "cargo clippy --all-targets --all-features"

[tasks."test:unit"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run Rust unit tests."
run = "cargo test --all-features"

[tasks."test:tooling"]
description = "Test binary staging and release archive contents."
run = "python -m unittest discover -s scripts/tests"
