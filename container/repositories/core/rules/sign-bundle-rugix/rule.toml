description = "Authenticate a Rugix bundle with a configurable signing certificate."
category = "Update Bundles"
secrets = ["key"]

[inputs.bundle]
kind = "file"
description = "Existing Rugix update bundle to authenticate."

[inputs.certificate]
kind = "file"
description = "Single PEM-encoded RSA X.509 end-entity signer certificate issued directly by the trusted root. No intermediates."

[parameters.signing-time]
description = "Signing time as Unix seconds in a string (0..2524607999). Empty uses the build source epoch."
default = ""

[execution]
type = "run"
command = ["rugix-bakery", "internal", "exec-rule", "sign-bundle-rugix"]

[execution.outputs.bundle]
description = "Authenticated Rugix update bundle."
kind = "file"
path = "update.rugixb"
