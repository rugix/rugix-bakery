description = "Sign a PE executable for UEFI Secure Boot."
category = "Signing"
secrets = ["key"]

[inputs.image]
kind = "file"
description = "PE executable to sign, such as a UKI or bootloader."

[inputs.certificate]
kind = "file"
description = "PEM-encoded RSA X.509 signing certificate."

[parameters.signing-time]
description = "Signing time as Unix seconds in a string (0..2524607999). Empty uses the build source epoch."
default = ""

[execution]
type = "run"
command = ["rugix-bakery", "internal", "exec-rule", "sign-efi"]

[execution.outputs.image]
description = "PE executable with a UEFI Secure Boot signature."
kind = "file"
path = "signed.efi"
