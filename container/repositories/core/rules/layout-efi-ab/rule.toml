description = "Reserve the named A/B partitions for the EFI verified boot flow."
category = "Verified Boot"

[inputs.system]
kind = "file"
description = "Root filesystem image with appended verity data."

[inputs.config]
kind = "file"
description = "EFI System Partition image, used as the configuration partition."

[parameters.secondary-config]
description = "Reserve an empty secondary configuration partition with the same capacity as the ESP."
default = false

[execution]
type = "run"
command = ["rugix-bakery", "internal", "exec-rule", "layout-efi-ab"]

[execution.outputs.layout]
kind = "file"
path = "layout.json"
description = "Rugix ImageLayout with named A/B partitions."

[execution.outputs.partitions]
kind = "directory"
path = "partitions"
description = "Factory partition images named by their one-based partition numbers."
