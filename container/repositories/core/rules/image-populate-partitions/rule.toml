description = "Populate numbered partition images for core/assemble-disk based on an image layout."
category = "Image Assembly"

[inputs.layout]
kind = "file"
description = "Rugix ImageLayout definition in JSON or TOML."

[inputs.image]
kind = "file"
description = "Unpopulated disk image - e.g. output of core/image-layout output."

[inputs.roots]
kind = "directory"
description = "Prepared filesystem trees addressed by each partition root."

[execution]
type = "run"
command = ["rugix-bakery", "internal", "exec-rule", "image-populate-partitions"]

[execution.outputs.partitions]
kind = "directory"
path = "partitions"
description = "Filesystem images named by their partition number, ready for core/assemble-disk (skips unpopulated and extended partitions)."
