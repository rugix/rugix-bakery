description = "Generate an initrd with the supplied root filesystem's mkinitramfs."
category = "Boot Artifacts"

[inputs.rootfs]
kind = "directory"
description = "Root filesystem containing mkinitramfs, hooks, and target kernel modules."

[inputs.kernel-version]
kind = "file"
description = "Text file containing one kernel version."

[execution]
type = "run"
command = ["rugix-bakery", "internal", "exec-rule", "initrd-debian"]

[execution.outputs.initrd]
description = "Initrd generated by the supplied root filesystem's mkinitramfs."
kind = "file"
path = "initrd"
