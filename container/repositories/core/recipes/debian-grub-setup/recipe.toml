description = "Prepare Debian for the generic GRUB targets."
category = "Boot Setup"
dependencies = ["rugix-ctrl"]

[parameters.with_firmware]
description = "Install firmware packages. Use true or false."
default = "true"

[parameters.with_nonfree]
description = "Enable the non-free archive components. Use true or false."
default = "true"

[parameters.with_squashfs]
description = "Include SquashFS support in the initramfs. Use true or false."
default = "true"
